name: Validate courses

on:
  push:
    branches: [main]
  pull_request:

jobs:
  adult-course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check JavaScript syntax
        working-directory: python
        run: |
          for file in course-session progress markup reader views application; do
            node --check "assets/$file.js"
          done
      - name: Check Python examples
        working-directory: python
        run: python -m compileall -q examples practice solutions
      - name: Check the bundle matches the localized sources
        run: |
          python python/scripts/build-course.py
          git diff --exit-code -- python/assets/course-content.js

  child-course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        working-directory: python-for-children
        run: |
          for file in *.js; do
            node --check "$file"
          done
      - name: Check mission content is complete
        run: node python-for-children/check-content.js
